---
deployment:
  tasks:
    - export DEPLOYPATH=/home2/ericod74/public_html/concretobrasils.online
    - /bin/mkdir -p "$DEPLOYPATH"
    - /usr/bin/rsync -a --delete --exclude='.well-known/' --exclude='.git/' --exclude='.github/' --exclude='.cpanel.yml' --exclude='.nojekyll' --exclude='README.md' ./ "$DEPLOYPATH/"
    - /usr/bin/test -s "$DEPLOYPATH/index.html" -a -s "$DEPLOYPATH/script.js" -a -s "$DEPLOYPATH/.htaccess"
    - /bin/chmod 755 "$DEPLOYPATH"
    - /bin/echo 'Concreto Brasil: deploy sincronizado concluido'
