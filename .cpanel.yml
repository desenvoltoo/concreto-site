    - /bin/mkdir -p $DEPLOYPATH/orcamento
    - /bin/mkdir -p $DEPLOYPATH/concreto-usinado
    - /bin/mkdir -p $DEPLOYPATH/bombeamento-de-concreto
    - /bin/cp index.html $DEPLOYPATH/index.html
    - /bin/cp styles.css $DEPLOYPATH/styles.css
    - /bin/cp ux.css $DEPLOYPATH/ux.css
    - /bin/cp shell.css $DEPLOYPATH/shell.css
    - /bin/cp visuals.css $DEPLOYPATH/visuals.css
    - /bin/cp script.js $DEPLOYPATH/script.js
    - /bin/cp favicon-32.png $DEPLOYPATH/favicon-32.png
