---
deployment:
  tasks:
    - export DEPLOYPATH=/home2/ericod74/public_html/concretobrasils.online
    - /bin/mkdir -p "$DEPLOYPATH"
    - /usr/bin/find "$DEPLOYPATH" -mindepth 1 -maxdepth 1 ! -name '.well-known' -exec /bin/rm -rf {} +
    - /bin/cp -a . "$DEPLOYPATH/"
    - /bin/rm -rf "$DEPLOYPATH/.git" "$DEPLOYPATH/.github"
    - /bin/rm -f "$DEPLOYPATH/.cpanel.yml" "$DEPLOYPATH/.nojekyll" "$DEPLOYPATH/README.md"
    - /usr/bin/find "$DEPLOYPATH" -type d -exec /bin/chmod 755 {} +
    - /usr/bin/find "$DEPLOYPATH" -type f -exec /bin/chmod 644 {} +
    - /usr/bin/test -s "$DEPLOYPATH/index.html"
    - /usr/bin/test -s "$DEPLOYPATH/script.js"
    - /usr/bin/test -s "$DEPLOYPATH/.htaccess"
    - /bin/echo 'Concreto Brasil: deploy limpo e rapido concluido'
