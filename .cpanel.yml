---
deployment:
  tasks:
    - export DEPLOYPATH=/home2/ericod74/public_html/concretobrasils.online
    - /bin/mkdir -p "$DEPLOYPATH"
    - /bin/rm -rf "$DEPLOYPATH/index.html" "$DEPLOYPATH/styles.css" "$DEPLOYPATH/ux.css" "$DEPLOYPATH/shell.css" "$DEPLOYPATH/visuals.css" "$DEPLOYPATH/script.js" "$DEPLOYPATH/favicon-32.png" "$DEPLOYPATH/robots.txt" "$DEPLOYPATH/sitemap.xml" "$DEPLOYPATH/.htaccess" "$DEPLOYPATH/produtos" "$DEPLOYPATH/sobre" "$DEPLOYPATH/politica-de-privacidade" "$DEPLOYPATH/termos" "$DEPLOYPATH/orcamento" "$DEPLOYPATH/concreto-usinado" "$DEPLOYPATH/bombeamento-de-concreto"
    - /bin/cp -f index.html styles.css ux.css shell.css visuals.css script.js favicon-32.png robots.txt sitemap.xml .htaccess "$DEPLOYPATH/"
    - /bin/cp -R produtos sobre politica-de-privacidade termos orcamento concreto-usinado bombeamento-de-concreto "$DEPLOYPATH/"
    - /usr/bin/test -s "$DEPLOYPATH/index.html" -a -s "$DEPLOYPATH/script.js" -a -s "$DEPLOYPATH/.htaccess"
    - /bin/echo 'Concreto Brasil: deploy concluido'
