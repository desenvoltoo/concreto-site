---
deployment:
  tasks:
    - export DEPLOYPATH=/home2/ericod74/public_html/concretobrasils.online/
    - /bin/mkdir -p $DEPLOYPATH
    # DEPLOY LIMPO 2026-08-27 DIRECT1: remove toda a publicação anterior e preserva apenas .well-known/ para AutoSSL/ACME.
    - /usr/bin/find $DEPLOYPATH -mindepth 1 -maxdepth 1 ! -name '.well-known' -exec /bin/rm -rf {} \;
    - /bin/echo 'Concreto Brasil: publicação anterior removida; iniciando deploy limpo DIRECT1'
    - /bin/mkdir -p $DEPLOYPATH/produtos
    - /bin/mkdir -p $DEPLOYPATH/sobre
    - /bin/mkdir -p $DEPLOYPATH/politica-de-privacidade
